<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class ="d-flex align-items-center justify-content-center min-vh-100 bg-light p-4">
    
    <form class="align-items-center justify-content-center row-gap p-2" style="max-width: 400px; width: 75%;">
    <h1 class = " text-center bg-primary text-white p-2">Register</h1>
    <div class="input-group  p-2">
        <span class="input-group-text" id="basic-addon1">@</span>
        <input type="text" class="form-control" placeholder="Create Username" aria-label="Username" aria-describedby="basic-addon1">
    </div>
    <div class="col-mb-3 p-2">
        <label for="inputEmail4" class="form-label">Email</label>
        <input type="email" class="form-control" id="inputEmail4" placeholder="name@example.com">
    </div>
    <div class="col-mb-3 p-2">
        <label for="inputPassword4" class="form-label">Password</label>
        <input type="password" class="form-control" id="inputPassword4">
    </div>
    <div class="col-mb-3 p-2">
        <label for="inputPassword5" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="inputPassword5">
    </div>
    <div class="col-mb-3 p-2">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">I agree to the terms and conditions </label>
    </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <p class="mt-3 mb-2 text-muted text-center"> &copy; 2021 </p>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
